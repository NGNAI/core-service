# ============================================================================
# PROFILE "no-gateway" — TẮT HOÀN TOÀN Spring Cloud Gateway MVC
# ============================================================================
# Dùng khi: máy dev/CI không cần proxy service ngoài, hoặc muốn giảm
# ~2-3s thời gian khởi động, hoặc service đích không sẵn sàng.
#
# CÁCH DÙNG (chọn 1):
#   1) Chạy bằng Maven:
#        ./mvnw spring-boot:run -pl core -Dspring-boot.run.profiles=no-gateway
#   2) Chạy bằng jar:
#        java -jar core-1.0-SNAPSHOT.jar --spring.profiles.active=no-gateway
#   3) Biến môi trường:
#        SPRING_PROFILES_ACTIVE=no-gateway
#
# ----------------------------------------------------------------------------
# TẠI SAO PHẢI EXCLUDE CẢ 7 CLASS (không chỉ set enabled=false)?
# ----------------------------------------------------------------------------
# Trong jar spring-cloud-gateway-server-webmvc 5.0.4:
#
#   @ConditionalOnProperty(name = "spring.cloud.gateway.server.webmvc.enabled",
#                          matchIfMissing = true)
#   public class GatewayServerMvcAutoConfiguration { ... }
#
# Property `enabled` này có thật, NHƯNG 6 auto-config phụ dưới đây KHÔNG có
# cùng điều kiện đó. Chỉ set enabled=false -> config chính bị tắt (không tạo
# bean GatewayMvcProperties), trong khi FilterAutoConfiguration vẫn nạp và
# đòi bean đó -> app CHẾT ngay khi khởi động:
#
#   APPLICATION FAILED TO START
#   Parameter 0 of constructor in ...FilterAutoConfiguration$RetryFilterConfiguration
#   required a bean of type '...config.GatewayMvcProperties' that could not be found.
#
# Đã kiểm chứng bằng cách chạy thật: exclude đủ 7 class -> app start OK.
# ----------------------------------------------------------------------------
spring:
  autoconfigure:
    exclude:
      # Config chính: tạo GatewayMvcProperties + router function
      - org.springframework.cloud.gateway.server.mvc.GatewayServerMvcAutoConfiguration
      # Cảnh báo thiếu webmvc trên classpath (không cần khi đã tắt)
      - org.springframework.cloud.gateway.server.mvc.GatewayMvcClassPathWarningAutoConfiguration
      # Đăng ký filter (cần GatewayMvcProperties -> phải exclude)
      - org.springframework.cloud.gateway.server.mvc.filter.FilterAutoConfiguration
      # Đăng ký handler function
      - org.springframework.cloud.gateway.server.mvc.handler.HandlerFunctionAutoConfiguration
      # Multipart resolver cho gateway
      - org.springframework.cloud.gateway.server.mvc.handler.GatewayMultipartAutoConfiguration
      # Đăng ký predicate
      - org.springframework.cloud.gateway.server.mvc.predicate.PredicateAutoConfiguration
      # Function mặc định (path/uri/...)
      - org.springframework.cloud.gateway.server.mvc.config.DefaultFunctionConfiguration

# ----------------------------------------------------------------------------
# LƯU Ý KHI TẮT GATEWAY
# ----------------------------------------------------------------------------
# 1) Block `spring.cloud.gateway.*` trong application.yml KHÔNG cần xóa —
#    không có auto-config nào đọc nên nó bị bỏ qua hoàn toàn.
#
# 2) Route proxy biến mất -> gọi /api/v1/spellcheck/** sẽ KHÔNG còn forward.
#    (Đã test: trả 500 UNEXPECTED do GlobalExceptionHandler bắt
#     NoResourceFoundException — hơi xấu nhưng không phải lỗi.)
#
# 3) Endpoint /public/docs/spellcheck VẪN hoạt động (nó gọi upstream trực tiếp
#    bằng WebClient, KHÔNG qua gateway) — nhưng `servers` trong spec vẫn trỏ
#    /api/v1/spellcheck nên nút "Try it out" sẽ fail vì route không còn.
#    Nếu KHÔNG muốn hiện mục này trong Swagger UI khi đã tắt gateway, bỏ comment
#    block dưới (danh sách urls của profile sẽ ghi đè danh sách ở application.yml):
#
# springdoc:
#   swagger-ui:
#     urls:
#       - name: Main System APIs
#         url: /v3/api-docs
