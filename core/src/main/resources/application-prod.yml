# ============================================================================
# CẤU HÌNH SERVER (HTTP/Tomcat nhúng)
# ============================================================================
server:
  servlet:
    # Tiền tố URL cho toàn bộ API. Mọi endpoint sẽ nằm dưới /api/v1/**,
    # ví dụ /api/v1/auth/login, /api/v1/user/topics ...
    # -> Khi FE gọi, bắt buộc phải có tiền tố này.
    # Đổi thành "" nếu muốn API ở gốc (không khuyến khích).
    context-path: "/api/v1"
  # Cổng HTTP chạy ứng dụng. Production thường sau reverse proxy (nginx) thì
  # nên để 8080 và proxy sang port khác, hoặc để 8080 và đổi ngoài proxy.
  port: 8081

spring:
  application:
    # Tên ứng dụng: dùng cho monitoring (Prometheus/Grafana/Spring Boot Admin),
    # tên instance trong log, tag metrics. Nên là tên dễ nhận diện.
    name: "NGN AI core"

  main:
    # Cho phép vòng lặp tham chiếu giữa các bean Spring.
    # Mặc định Spring Boot cấm để tránh lỗi thiết kế, nhưng project này đang
    # có vài service phụ thuộc chéo -> cần bật. KHÔNG nên đặt false nếu chưa
    # xử lý triệt để các vòng lặp này.
    allow-circular-references: true

  # User Actuator (basic auth) được định nghĩa tường minh trong ApplicationConfig#actuatorUserDetailsService
  # (username: monitor, password: env ACTUATOR_USER_PASSWORD, mặc định "changeme").
  # KHÔNG liên quan đến login người dùng (các chain /auth/**, /user/**, /admin/** dùng JWT/OAuth2).

  # ==========================================================================
  # THREAD POOL cho các job @Scheduled (định kỳ)
  # ==========================================================================
  # Spring Boot mặc định chỉ dùng 1 thread cho mọi @Scheduled -> nếu có nhiều
  # job đồng thời (auto-ingestion, delete queue, LDAP sync...) dễ bị nghẽn.
  # pool.size: số luồng tối đa chạy song song. Nên >= số job định kỳ quan trọng.
  # thread-name-prefix: tiền tố tên thread để dễ nhận diện trong log/telemetry.
  task:
    scheduling:
      pool:
        size: 5
      thread-name-prefix: "scheduling-"

  # ==========================================================================
  # GIỚI HẠN KÍCH THƯỚC FILE UPLOAD (HTTP multipart)
  # ==========================================================================
  # Giới hạn file đơn (max-file-size) và tổng request (max-request-size) khi
  # upload qua attachment/ingestion. Ví dụ: muốn giới hạn 50MB -> đổi "50MB".
  # Lưu ý: cũng phải khớp giới hạn phía MinIO/ingestion service nếu có.
  servlet:
    multipart:
      max-file-size: "100MB"
      max-request-size: "100MB"

  # ==========================================================================
  # KẾT NỐI POSTGRESQL (nguồn dữ liệu chính)
  # ==========================================================================
  # Dùng placeholder biến môi trường để an toàn bí mật, mặc định là giá trị DEV.
  #  - DB_HOST    : địa chỉ máy PostgreSQL
  #  - DB_PORT    : cổng (mặc định PostgreSQL 5432)
  #  - DB_NAME    : tên database
  #  - DB_USERNAME: user đăng nhập DB
  #  - DB_PASSWORD: mật khẩu DB -> BẮT BUỘC đặt env trong production, đừng để default.
  # Ví dụ kết nối: jdbc:postgresql://192.168.30.72:5432/core_service_3 (user postgres)
  datasource:
    url: "jdbc:postgresql://${DB_HOST:192.168.30.72}:${DB_PORT:5432}/${DB_NAME:core_service_prod_1}"
    username: "${DB_USERNAME:postgres}"
    password: "${DB_PASSWORD:P@ssw0rd}"

  # ==========================================================================
  # JPA / HIBERNATE (ánh xạ entity -> bảng DB)
  # ==========================================================================
  # LƯU Ý QUAN TRỌNG: Schema do FLYWAY quản lý hoàn toàn (V1__init_schema.sql chứa
  # CREATE TABLE đầy đủ). Hibernate KHÔNG tự tạo/sửa bảng:
  #  - ddl-auto: "none"  -> KHÔNG can thiệp schema. Đây là giá trị BẮT BUỘC GIỮ.
  #    Không đổi sang "update" vì sẽ làm lệch schema so với Flyway.
  #  - show-sql: bật (true) để xem câu SQL thực thi khi debug; tắt ở production.
  #  - format_sql: định dạng lại SQL cho dễ đọc.
  jpa:
    database-platform: "org.hibernate.dialect.PostgreSQLDialect"
    hibernate:
      ddl-auto: "none"
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        # Cho phép Hibernate Validator áp dụng constraint validation lên DDL
        # (giữ nguyên hành vi có sẵn; hiện không tác động vì ddl-auto=none).
        validator:
          apply_to_ddl: true

  # ==========================================================================
  # FLYWAY (quản lý migration database - NGUỒN SỰ THẬT của schema)
  # ==========================================================================
  # - enabled: bật/tắt Flyway khi khởi động.
  # - locations: thư mục chứa các file migration V{n}__desc.sql.
  # - baseline-on-migrate: nếu DB đã có bảng mà chưa có lịch sử Flyway,
  #   cho phép baseline để không phá dữ liệu cũ khi migration tới.
  # Quy tắc: khi đổi schema -> TẠO file V{n+1}_mo_ta.sql, không sửa file cũ.
  migration:
    enabled: true
    locations: "classpath:db/migration"
    baseline-on-migrate: true

  # ==========================================================================
  # REDIS (cache, session, hàng đợi tức thời)
  # ==========================================================================
  # - REDIS_PASSWORD: mật khẩu Redis. Mặc định dev là "P@ssw0rd".
  #   Production phải đặt env riêng, đừng giữ default này.
  # - REDIS_HOST / REDIS_PORT: địa chỉ máy Redis.
  # - timeout: timeout kết nối (ms). lettuce.shutdown-timeout: thời gian chờ
  #   đóng kết nối khi tắt ứng dụng (tránh treo khi stop).
  data:
    redis:
      password: "${REDIS_PASSWORD:P@ssw0rd}"
      host: "${REDIS_HOST:localhost}"
      port: 6379
      timeout: 60000
      lettuce:
        shutdown-timeout: 100

  # Spring Boot Admin Client: đăng ký ứng dụng với Spring Boot Admin Server để theo dõi qua UI
  # boot:
  #   admin:
  #     client:
  #       # URL của Spring Boot Admin Server (đổi theo địa chỉ server thật của bạn)
  #       url: "http://localhost:8081"
  #       enabled: true
  #       auto-registration: true
  #       auto-deregistration: true
  #       register-once: true
  #       instance:
  #         name: "${spring.application.name}"
  #         management-url: "http://localhost:8080/api/v1/actuator"
  #         service-url: "http://localhost:8080/api/v1"
  #         health-url: "http://localhost:8080/api/v1/actuator/health"

# ============================================================================
# LOGGING (log level + tích hợp Loki)
# ============================================================================
logging:
  # Mức log theo từng package. Chỉnh mức để debug từng phần:
  #  - org.flywaydb: DEBUG  -> xem chi tiết migration khi khởi động
  #  - org.springframework.jdbc.core: ERROR -> ít nhìn SQL rác
  #  - org.springframework.web: DEBUG    -> xem request/response log
  #  - root: mức mặc định cho toàn app
  # Kinh nghiệm: production nên đặt higher (INFO/WARN) để giảm tải disk/log.
  level:
    org.flywaydb: DEBUG
    org.springframework.boot.autoconfigure.flyway: DEBUG
    org.springframework.jdbc.core: "ERROR"
    org.springframework.web: "DEBUG"
    root: "INFO"
    com.baeldung: "TRACE"
    de.codecentric.boot.admin.client: "DEBUG"
    org.springframework.boot.actuate: "DEBUG"
  # ==========================================================================
  # LOKI (log aggregation - gom log về Loki để truy vấn trên Grafana)
  # ==========================================================================
  # - LOKI_URL     : endpoint push log của Loki.
  # - LOKI_USER    : username basic auth (nếu Loki bật auth).
  # - LOKI_PASSWORD: mật khẩu basic auth. Production đặt env riêng.
  loki:
    url: "${LOKI_URL:http://localhost:3100/loki/api/v1/push}"
    user: "${LOKI_USER:loki}"
    password: "${LOKI_PASSWORD:loki123}"

# ============================================================================
# SPRING BOOT ACTUATOR (health, metrics, monitoring)
# ============================================================================
# Endpoint quản lý cho phép kiểm tra sức khỏe và thu thập metrics.
# - exposure.include: đăng ký endpoint Actuator (prometheus để Grafana scrape).
# - base-path: đường dẫn gốc, mặc định /actuator.
# - endpoint.health: show chi tiết + components + probe (cho liveness/readiness).
# - metrics.distribution: bật histogram để tính percentile (p95) cho http + một số timer.
management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,env,beans,httptrace,threaddump,heapdump,loggers,prometheus,scheduledtasks,sessions"
      base-path: "/actuator"
  endpoint:
    health:
      show-details: "always"
      show-components: "always"
      probes:
        enabled: true
    info:
      enabled: true
    loggers:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      # Tag "application" được gắn cho mọi metric -> dễ lọc theo app trong Grafana.
      application: "${spring.application.name}"
    distribution:
      percentiles-histogram:
        # Bật histogram cho các timer dưới đây để Grafana tính được p95/v.v.
        http.server.requests: true
        auth.login: true
        api.topic.list: true
        api.notebook.list: true
        api.draft.list: true
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true

