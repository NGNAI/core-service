# ============================================================================
# JWT (JSON Web Token - xác thực đăng nhập)
# ============================================================================
# - JWT_SECRET_KEY: khóa bí mật dùng ký/kiểm tra token. QUAN TRỌNG:
#   - Ít nhất 256-bit (~32+ ký tự) để đủ mạnh cho HS256.
#   - Bắt buộc đặt env JWT_SECRET_KEY riêng trong production (đừng giữ default dev).
#   - Đổi secret sẽ làm MỌI token cũ hết hạn -> người dùng phải login lại.
# - expiry-duration: thời gian sống token (giây). 216000 = 60 giờ. Đặt 0/lớn ít
#   hơn để buộc đăng nhập lại thường xuyên hơn cho an toàn.
