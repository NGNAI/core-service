  secret-key: "${MINIO_SECRET_KEY:password}"

# ============================================================================
# INTEGRATION (kết nối các service ngoài: attachment, ingestion...)
# ============================================================================
# Các API key dùng cho tích hợp giữa core-service với service khác.
# - header-name: tên HTTP header mang key.
# - key: giá trị key. Production đặt env riêng (ATTACHMENT_API_KEY,
#   DATA_INGESTION_API_KEY). Đổi key sẽ buộc service đối tác cập nhật theo.
integration:
  # ==========================================================================
  # ATTACHMENT API (file đính kèm)
  # ==========================================================================
  attachment-api:
    header-name: "X-API-KEY"
    key: "${ATTACHMENT_API_KEY:ATTACHMENT_API_KEY_1234567890}"

  # ==========================================================================
  # DATA INGESTION API (đẩy dữ liệu lên ingestion service)
  # ==========================================================================
  data-ingestion-api:
    header-name: "X-API-KEY"
    key: "${DATA_INGESTION_API_KEY:DATA_INGESTION_API_KEY_1234567890}"

  # ==========================================================================
  # CALLBACK DATA INGESTION (ingestion service báo trạng thái về core)
  # ==========================================================================
  # Khi ingestion xử lý xong, nó gọi webhook này để cập nhật trạng thái.
  # - url: endpoint webhook trên core-service.
  # - signature: shared secret để XÁC THỰC callback (chỉ chấp nhận request có đúng
  #   secret này). Đặt env DATA_INGESTION_CALLBACK_SECRET riêng ở production.
  data-ingestion-callback:
    url: "${DATA_INGESTION_CALLBACK_URL:http://192.168.30.71:8080/api/v1/user/data-ingestion/ingestion/webhook/status}"
    signature: "${DATA_INGESTION_CALLBACK_SECRET:ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890}"

  # ==========================================================================
  # CALLBACK NOTEBOOK SOURCE (ingestion báo trạng thái notebook source)
  # ==========================================================================
  # Tương tự callback data-ingestion nhưng dành cho nguồn của Notebook.
  # - url: endpoint webhook trên core-service.
  # - signature / signature-param-name / signature-header-name: cách truyền shared
  #   secret để xác thực. Cho phép gửi qua query param (?signature=...) HOẶC
  #   header (X-Webhook-Signature: ...). Production đặt secret riêng.
  notebook-source-callback:
    url: "${NOTEBOOK_SOURCE_CALLBACK_URL:http://192.168.30.71:8080/api/v1/user/notebooks/sources/ingestion/webhook/status}"
    signature: "${NOTEBOOK_SOURCE_CALLBACK_SECRET:ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890}"
    signature-param-name: "signature"
    signature-header-name: "X-Webhook-Signature"

# ============================================================================
# AUTO-INGESTION (tự động ingest dữ liệu từ thư mục)
# ============================================================================
# Quét thư mục input, đẩy file mới lên ingestion service (RAG) một cách tự động.
# LUỒNG: quét input -> move sang .processing -> gửi ingestion (retry nếu lỗi) ->
# đẩy thành công thì xóa file local (ếu delete-local-after-success=true),
# thất bại vượt max-retry thì chuyển sang .failed.
# - input-dir / processing-dir / failed-dir: các thư mục dùng cho pipeline.
#   LƯU Ý: là đường dẫn TỪ MÁY CHẠY app (Windows VD "D:/input")
#   -> nếu chạy Docker cần mount volume vào đúng đường dẫn này.
#   VD Linux: "/data/input", "/data/input/.processing", "/data/input/.failed".
# - poller-delay-ms: chu kỳ quét thư mục (ms). 5000 = 5 giây.
# - file-stable-seconds: thời gian file phải ổn định (không còn ghi) trước khi
#   bắt đầu xử lý - tránh bắt file đang copy dở.
# - max-messages-per-poll: số file tối đa xử lý trong mỗi lượt quét (tránh quá tải).
# - max-retry-attempts: số lần gửi lại khi ingestion thất bại. Đặt 0 = không retry.
#   Khi retry, record FAILED cũ được tái sử dụng (theo name+parent+owner+org+
#   fromSource+accessLevel) để tránh trùng lắp DB.
# - access-level / from-source: gán quyền/nhãn mặc định cho dữ liệu ingest.
# - delete-local-after-success: true = xóa file local sau khi đẩy thành công.
auto-ingestion:
  enabled: true
  input-dir: "/opt/dev/app/data-input/input"
  processing-dir: "/opt/dev/app/data-input/input/.processing"
  failed-dir: "/opt/dev/app/data-input/input/.failed"
  poller-delay-ms: 5000
  file-stable-seconds: 20
  max-messages-per-poll: 50
  max-retry-attempts: 3
  access-level: "GLOBAL"
  from-source: "SYSTEM"
  delete-local-after-success: true

# ============================================================================
# MAINTENANCE (giới hạn retry cho các scheduler dọn dẹp)
# ============================================================================
# Tránh retry VÔ HẠN gây nghẽn DB/log cho các tác vụ bảo trì định kỳ:
# - max-delete-retries : số lần thử xóa tối đa cho hàng đợi xóa
#   (data ingestion + notebook source) khi xóa thất bại.
# - max-dispatch-retries: số lần thử gửi lại source notebook lên ingestion tối đa.
#   Nếu vượt -> chuyển trạng thái thất bại để xử lý thủ công.
maintenance:
  max-delete-retries: 5
  max-dispatch-retries: 5

# ============================================================================
# SECURITY (cấu hình bổ sung ngoài RBAC)
# ============================================================================
security:
  # ==========================================================================
  # WHITELIST ADMIN (bỏ qua Role/Permission)
  # ==========================================================================
  # Danh sách username được phép truy cập System Setting & System Health admin APIs
  # dù không có quyền RBAC. Để trống/null -> fallback về ["root"].
  # VD muốn thêm user "devops" -> thêm vào list dưới.
  admin-allowed-usernames:
    - "root"
    - "admin"
  # ==========================================================================
  # CORS (allowed origins)
  # ==========================================================================
  # Danh sách origin (domain) được phép gọi API từ trình duyệt.
  #  - Để trống ""  -> cho phép TẤT CẢ origin (CHỈ DÀNH CHO DEV).
  #  - Production BẮT BUỘC liệt kê domain FE cụ thể, hỗ trợ wildcard pattern.
  # VD:
  #   allowed-origins:
  #     - "https://ai.example.com"
  #     - "https://*.example.com"
  allowed-origins: ""

# ============================================================================
# LDAP (đăng nhập/đồng bộ user qua OTP Service)
# ============================================================================
# Tích hợp LDAP: user đăng nhập được xác thực qua OTP Service dùng làm cầu nối.
# - default-org-id : UUID organization mặc định gán cho user LDAP mới
#   (khi login lần đầu / auto-sync). Để trống = KHÔNG auto-assign.
# - default-role-id: UUID role mặc định khi gán user LDAP. Để trống -> fallback
#   về role có defaultAssign=true.
# - update-on-login: có cập nhật thông tin user từ OTP Service khi login lại
#   không (mặc định KHÔNG -> giữ thông tin đã đồng bộ trước đó).
# - sync.enabled / sync.cron: bật/tắt + lịch đồng bộ user LDAP định kỳ.
#   VD cron "0 0 2 * * ?" = chạy lúc 2h sáng mỗi ngày.
ldap:
  default-org-id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
  default-role-id: ""
  update-on-login: false
  sync:
    enabled: false
    cron: "0 0 2 * * ?"

# ============================================================================
# SHARE LINK (chia sẻ công khai Topic / Notebook qua link)
# ============================================================================
# Tạo link public (read-only) có token để người ngoài xem Topic/Notebook.
# - base-url: gốc URL dùng build link đầy đủ trả về FE.
#   VD base-url="https://ai.example.com/share" -> link:
#     https://ai.example.com/share/{token}
#   Để trống -> chỉ trả token, FE tự build URL.
# - default-expiry-days: ngày hết hạn mặc định khi owner không chỉ định.
#   Để null = vĩnh viễn (mặc định). VD đặt 7 -> link mặc định hết hạn sau 7 ngày.
# - max-expiry-days: thời hạn tối đa owner được đặt (an toàn, mặc định 365).
# - token-length: độ dài token tính bằng byte (base64 URL-safe -> ~1.33x ký tự).
#   Mặc định 32 byte (~43 ký tự). Không nên dưới 16.
share:
  base-url: ""
  default-expiry-days:
  max-expiry-days: 365
  token-length: 32

# ============================================================================
# SPRINGDOC / SWAGGER UI (tài liệu API)
# ============================================================================
# Bật tạo tài liệu OpenAPI và giao diện Swagger UI để test API bằng tay.
# - api-docs.enabled: có tạo file OpenAPI JSON (endpoint /v3/api-docs) hay không.
# - swagger-ui.enabled: có hiển thị giao diện Swagger UI (/swagger-ui/**) hay không.
#   Production có thể tắt để tránh lộ API.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true