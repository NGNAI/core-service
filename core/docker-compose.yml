version: '3.8'

services:
  core-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: core-service
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://192.168.30.72:5432/core_service
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=P@ssw0rd
      - SPRING_DATA_REDIS_HOST=host.docker.internal
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=P@ssw0rd
      - SPRING_PROFILES_ACTIVE=win
    depends_on:
      - redis
    networks:
      - core-network

  redis:
    image: redis:7-alpine
    container_name: redis-core
    ports:
      - "6379:6379"
    command: redis-server --requirepass P@ssw0rd
    volumes:
      - redis-data:/data
    networks:
      - core-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  core-network:
    driver: bridge

volumes:
  redis-data:
