# Bộ cấu hình local monitoring: Prometheus + Grafana cho core-service
# Chạy:  docker compose -f monitoring/docker-compose.yml up -d
#   - Prometheus: http://localhost:9090
#   - Grafana:    http://localhost:3000  (admin / admin)
version: "3.8"

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: monitoring-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    environment:
      # Password basic auth để scrape /actuator/prometheus (khớp với ACTUATOR_USER_PASSWORD của app)
      # Mặc định "changeme" — nhớ đổi và đặt cùng giá trị với biến môi trường của core-service.
      ACTUATOR_USER_PASSWORD: "${ACTUATOR_USER_PASSWORD:-changeme}"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: monitoring-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "http://localhost:3000"
      # Tự động nạp datasource + dashboard từ volume provisioning
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - monitoring

volumes:
  prometheus-data:
  grafana-data:

networks:
  monitoring:
    driver: bridge
