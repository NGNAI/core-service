# Grafana datasource provisioning — tự nạp datasource Prometheus và Loki khi Grafana khởi động
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    orgId: 1
    url: http://prometheus:9090   # tên service trong docker-compose
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 15s
      httpMethod: POST

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    orgId: 1
    url: http://loki:3100         # tên service trong docker-compose
    editable: true
    isDefault: false
    jsonData:
      maxLines: 100
      httpMethod: POST
      derivedFields:
        - datasourceUid: prometheus
          matcherRegex: ".*(request_id=([a-zA-Z0-9-]+)).*"
          name: request_id
          url: "$${__value.raw}"
