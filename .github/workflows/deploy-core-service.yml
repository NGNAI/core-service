name: Deploy Core Service

on:
  push:
    branches:
      - master
    paths:
      - core/**
      - common/**
      - pom.xml
      - core/pom.xml
      - common/pom.xml
      - .github/workflows/deploy-core-service.yml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, linux]
    permissions:
      contents: read
    concurrency:
      group: core-service-deploy
      cancel-in-progress: true
    env:
      SERVICE_NAME: core_service
      DEPLOY_JAR_PATH: /opt/dev/app/core-1.0-SNAPSHOT.jar

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build JAR
        env:
          HOME: /home/github-runner   # Hoặc /home/github-runner tùy user chạy runner
        run: |
          chmod +x ./mvnw
          ./mvnw -B -ntp -pl core -am clean package -DskipTests

      - name: Deploy and restart service
        shell: bash
        run: |
          set -euo pipefail

          JAR_SOURCE="core/target/core-1.0-SNAPSHOT.jar"

          if [ ! -f "$JAR_SOURCE" ]; then
            echo "JAR not found at: $JAR_SOURCE"
            ls -la core/target || true
            exit 1
          fi

          # Ensure target directory exists and copy new jar.
          sudo mkdir -p "$(dirname "$DEPLOY_JAR_PATH")"
          sudo install -m 0644 "$JAR_SOURCE" "$DEPLOY_JAR_PATH"

          sudo systemctl restart "$SERVICE_NAME"

          sudo systemctl is-active "$SERVICE_NAME"
          sudo systemctl --no-pager --full status "$SERVICE_NAME" | head -n 30

      # Health check sau deploy: chờ app sẵn sàng (tối đa 120s), nếu fail → báo lỗi để rollback thủ công
      - name: Health check
        shell: bash
        run: |
          set -euo pipefail
          HEALTH_URL="${HEALTH_URL:-http://localhost:8081/api/v1/actuator/health/readiness}"
          echo "Checking $HEALTH_URL ..."
          for i in $(seq 1 24); do
            if curl -fsS --max-time 5 "$HEALTH_URL" > /dev/null 2>&1; then
              echo "✅ App is healthy (attempt $i)"
              exit 0
            fi
            echo "⏳ Attempt $i/24 failed, waiting 5s..."
            sleep 5
          done
          echo "❌ App did not become healthy within 120s after deploy"
          sudo systemctl --no-pager --full status "$SERVICE_NAME" | head -n 50 || true
          sudo journalctl -u "$SERVICE_NAME" -n 100 --no-pager || true
          exit 1
